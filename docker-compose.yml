# Grunnoppsettet: app, scheduler (de faste jobbene) og MariaDB.
# Legg til én av overstyringene:
#   hjemmelaben:  -f docker-compose.homelab.yml   (http://192.168.1.232:8081)
#   VPS (prod):   -f docker-compose.prod.yml      (https med eget domene)
#   lokalt:       -f docker-compose.local.yml     (http://localhost:8000)
services:
  app:
    build:
      context: .
      target: prod
    image: gaula-php:latest
    restart: unless-stopped
    env_file: .env
    environment: &dbenv
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gaula
      DB_USERNAME: gaula
      DB_PASSWORD: ${DB_PASSWORD:-gaula}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/app/public

  # Det cron gjør på et webhotell: Laravels scheduler hvert minutt.
  scheduler:
    image: gaula-php:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment: *dbenv
    depends_on:
      - app
    volumes:
      - uploads:/app/storage/app/public

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gaula
      MARIADB_USER: gaula
      MARIADB_PASSWORD: ${DB_PASSWORD:-gaula}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  dbdata:
  uploads:
