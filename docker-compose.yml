# Hjemmelaben: http://192.168.1.232:8081 (admin på /admin).
# MariaDB for å ligne webhotellet (MySQL/MariaDB, cache og køer i databasen).
services:
  app:
    build: .
    image: gaula-php:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    env_file: .env
    environment:
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gaula
      DB_USERNAME: gaula
      DB_PASSWORD: ${DB_PASSWORD:-gaula}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/app/public

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gaula
      MARIADB_USER: gaula
      MARIADB_PASSWORD: ${DB_PASSWORD:-gaula}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

volumes:
  dbdata:
  uploads:
